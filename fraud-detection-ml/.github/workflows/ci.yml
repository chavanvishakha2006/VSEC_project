name: Fraud Detection ML CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Build, Test & Validate ML Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Test Dataset for Code Validation
        run: |
          python src/generate_sample_data.py

      - name: Run Pytest Unit Test Suite
        run: |
          pytest tests/ --doctest-modules -v

      - name: Execute ML Training Pipeline Validation
        run: |
          python src/train.py --data-path data/sample_creditcard.csv

      - name: Build Docker Container Image
        run: |
          docker build -t fraud-detection-app .
